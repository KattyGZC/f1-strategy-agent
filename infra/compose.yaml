name: f1-strategy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8
    # Replays are throwaway and rebuilt from the clean model, so nothing is written to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      POSTGRES_CONNECT_TIMEOUT_S: ${POSTGRES_CONNECT_TIMEOUT_S:?}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:?}:${MONGO_ROOT_PASSWORD:?}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:?}
      OPENF1_BASE_URL: ${OPENF1_BASE_URL:?}
      OPENF1_REQUESTS_PER_SECOND: ${OPENF1_REQUESTS_PER_SECOND:?}
      OPENF1_REQUESTS_PER_MINUTE: ${OPENF1_REQUESTS_PER_MINUTE:?}
      OPENF1_MAX_CONCURRENCY: ${OPENF1_MAX_CONCURRENCY:?}
      OPENF1_MAX_ATTEMPTS: ${OPENF1_MAX_ATTEMPTS:?}
      OPENF1_BACKOFF_BASE_S: ${OPENF1_BACKOFF_BASE_S:?}
      OPENF1_TIMEOUT_S: ${OPENF1_TIMEOUT_S:?}
      SESSION_SETTLE_H: ${SESSION_SETTLE_H:?}
      TELEMETRY_WINDOW_MIN: ${TELEMETRY_WINDOW_MIN:?}
      TRANSFORM_MAX_CONCURRENCY: ${TRANSFORM_MAX_CONCURRENCY:?}
      TRANSFORM_MAX_ATTEMPTS: ${TRANSFORM_MAX_ATTEMPTS:?}
      TRANSFORM_BACKOFF_BASE_S: ${TRANSFORM_BACKOFF_BASE_S:?}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE:?}
      REDIS_URI: redis://redis:6379/0
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:?}
      REDIS_TIMEOUT_S: ${REDIS_TIMEOUT_S:?}
      REPLAY_MAX_ACTIVE: ${REPLAY_MAX_ACTIVE:?}
      REPLAY_IDLE_TTL_S: ${REPLAY_IDLE_TTL_S:?}
      REPLAY_TICK_S: ${REPLAY_TICK_S:?}
      REPLAY_LEASE_S: ${REPLAY_LEASE_S:?}
      REPLAY_APPEND_BATCH: ${REPLAY_APPEND_BATCH:?}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build: ../frontend
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
