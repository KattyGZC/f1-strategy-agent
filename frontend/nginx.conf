# The edge of the stack: request ids, limits and security headers (ADR 0016).

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;
server_tokens off;

server {
    listen 8080;
    root /usr/share/nginx/html;

    # No location sets a header of its own, since nginx would then drop every one of these there.
    add_header X-Request-ID $request_id always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        client_max_body_size 8k;
        limit_req zone=api burst=60 nodelay;
        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Always nginx's own id, never the client's; the backend echoes it, nginx sends it once.
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;

        location ~ ^/api/replays/[^/]+/events$ {
            proxy_pass http://backend:8000;
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"detail":"the request body is larger than the API accepts","code":"payload_too_large","request_id":"$request_id"}';
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"too many requests from this address; retry in a moment","code":"rate_limited","request_id":"$request_id"}';
    }

    location / {
        try_files $uri /index.html;
    }
}
