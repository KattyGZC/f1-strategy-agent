name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Makefile'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'Makefile'
              - '.github/workflows/**'
            infra:
              - 'infra/**'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'frontend/nginx.conf'
              - '.env.example'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # mongod 8 refuses to start on kernels 6.19 to 7.0.13 (jira.mongodb.org/browse/SERVER-121912),
    # and ubuntu-24.04 images from 20261018 run 7.0.0. Back to ubuntu-latest once mongo:8 starts there.
    runs-on: ubuntu-22.04
    env:
      # The runner is thrown away after the job, and keeping a container that failed to start
      # is what lets the next step print its logs.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          working-directory: backend
      - run: cd backend && uv sync --locked
      - run: make backend-check
      - if: failure()
        name: Containers started by the tests
        run: |
          uname -r
          docker version --format 'docker {{.Server.Version}}'
          docker ps --all --no-trunc
          for container in $(docker ps --all --quiet); do
            echo "::group::$(docker inspect --format '{{.Config.Image}} {{.State.Status}} exit {{.State.ExitCode}}' "$container")"
            docker logs "$container" 2>&1 | tail -n 100
            echo "::endgroup::"
          done

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: make frontend-check

  contract:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"
          working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - run: make openapi-check

  stack:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    # mongod 8 refuses to start on kernels 6.19 to 7.0.13 (jira.mongodb.org/browse/SERVER-121912),
    # and ubuntu-24.04 images from 20261018 run 7.0.0. Back to ubuntu-latest once mongo:8 starts there.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: make up
      - run: curl --fail --silent http://localhost:8080/api/health
      - if: always()
        run: make down
